<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pallavi Safety &amp; Vigilance</title>

<!-- ============================================================
     PASTE YOUR APP URL IN TWO PLACES: the meta refresh below,
     and the APP_URL constant in the script at the bottom.
     Get it from Apps Script > Deploy > Manage deployments, or by
     copying the address bar with the app open.
     ============================================================ -->
<meta http-equiv="refresh" content="0; url=https://script.google.com/a/macros/pallavimodelschools.org/s/AKfycbxQPN6UoIfByzI9gLxm1QnU5kpEca10mJoc-Lazz8IqcVe0MowWwGFY_nbau9xy1u1T/exec">

<style>
:root{--ink:#10233F;--surface:#F4F6FA;--line:#E3E8F0;--muted:#6B7A90;--accent:#2F53E6;--ok:#12A150}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--surface);color:var(--ink);padding:24px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:34px 30px;
  max-width:420px;width:100%;text-align:center;box-shadow:0 1px 3px rgba(16,35,63,.07)}
.mark{width:56px;height:56px;margin:0 auto 18px}
h1{font-size:19px;margin:0 0 6px;letter-spacing:-.01em}
p{font-size:14px;color:var(--muted);line-height:1.6;margin:0 0 22px}
a.go{display:block;padding:14px;border-radius:10px;background:var(--accent);color:#fff;
  text-decoration:none;font-weight:650;font-size:15px}
.dots{margin-top:18px;font-size:12px;color:var(--muted)}
.dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);
  margin:0 2px;animation:b 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
  <div class="card">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 2.4 4.6 5.3v6c0 4.6 3.1 8.8 7.4 10.3 4.3-1.5 7.4-5.7 7.4-10.3v-6L12 2.4Z"
            fill="#10233F"/>
      <path d="M8.4 12.6l2.5 2.6 4.7-5.1" fill="none" stroke="#2FD07A"
            stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>Pallavi Safety &amp; Vigilance</h1>
    <p>Taking you to the app. Sign in with your school Google account.</p>
    <a class="go" id="go" href="#">Open the app</a>
    <div class="dots">Redirecting <i></i><i></i><i></i></div>
  </div>

<script>
  var APP_URL = "https://script.google.com/a/macros/pallavimodelschools.org/s/AKfycbxQPN6UoIfByzI9gLxm1QnU5kpEca10mJoc-Lazz8IqcVe0MowWwGFY_nbau9xy1u1T/exec";
  document.getElementById('go').href = APP_URL;
  // Belt and braces: if the meta refresh is blocked, send them anyway.
  setTimeout(function(){ window.location.replace(APP_URL); }, 400);
</script>
</body>
</html>
